name: Windows build

# Builds the Windows VST3 plugins.
# - Pushing a tag v* (e.g. by publishing a GitHub Release) attaches the zip to that release.
# - "Run workflow" on the Actions tab builds without releasing; the zip is under the run's Artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "UNVRS-Plugins-$env:GITHUB_REF_NAME-Windows" } else { "UNVRS-Plugins-dev-Windows" }
          New-Item -ItemType Directory -Force -Path "dist/$name/VST3" | Out-Null
          Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 |
            Where-Object { $_.FullName -match '\\Release\\VST3\\[^\\]+\.vst3$' } |
            ForEach-Object { Copy-Item $_.FullName -Destination "dist/$name/VST3" -Recurse }
          Copy-Item LICENSE "dist/$name/"
          Get-ChildItem "dist/$name/VST3"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: windows-vst3
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
