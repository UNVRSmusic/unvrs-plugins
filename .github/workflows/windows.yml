name: Windows build

# Builds the Windows VST3 plugins.
# - Pushing a tag v* (e.g. by publishing a GitHub Release) attaches the zip to that release.
# - "Run workflow" on the Actions tab builds the selected branch. With "release_tag" filled in
#   (e.g. v0.1.0) the zip is attached to that existing release; without it, the zip is only
#   under the run's Artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach to this existing release (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # no -G: CMake picks the newest Visual Studio installed on the runner
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check static runtime
        # the plugins must not import the MSVC runtime DLLs (hosts such as Ableton load an older one)
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Path build -Recurse -File -Filter *.vst3 |
            Where-Object { $_.FullName -match '\\Release\\VST3\\.+\\Contents\\x86_64-win\\' } |
            Where-Object { [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($_.FullName)) -match '(?i)(MSVCP140|VCRUNTIME140)[^.]*\.dll' }
          if ($bad) { $bad.FullName; throw "plugins depend on the MSVC runtime DLLs" }
          "OK: no MSVC runtime DLL imports"

      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "dev" }
          $name = "UNVRS-Plugins-$ver-Windows"
          New-Item -ItemType Directory -Force -Path "dist/$name/VST3" | Out-Null
          Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 |
            Where-Object { $_.FullName -match '\\Release\\VST3\\[^\\]+\.vst3$' } |
            ForEach-Object { Copy-Item $_.FullName -Destination "dist/$name/VST3" -Recurse }
          Copy-Item LICENSE "dist/$name/"
          Get-ChildItem "dist/$name/VST3"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: windows-vst3
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ZIP }}
